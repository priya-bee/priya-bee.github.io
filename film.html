<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Film | Priya Bhatnagar</title>
  <link rel="icon" href="build/static/images/avos.png">
  <link rel="apple-touch-icon" href="build/static/images/avos.png">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="home.html">priya bhatnagar</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="film.html" aria-current="page">Film</a>
      <a href="code.html">Code</a>
      <a href="oil.html">Oil</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main class="film-page">
    <h1>FILM</h1>
    <div class="film-tabs" role="tablist" aria-label="Film work categories">
      <button id="directed-tab" class="film-tab" type="button" role="tab" aria-selected="true" aria-controls="directed-panel" tabindex="0">Work I directed</button>
      <button id="edited-tab" class="film-tab" type="button" role="tab" aria-selected="false" aria-controls="edited-panel" tabindex="-1">Work I edited</button>
      <button id="assisted-tab" class="film-tab" type="button" role="tab" aria-selected="false" aria-controls="assisted-panel" tabindex="-1">Work I assisted on</button>
    </div>
    <section id="directed-panel" class="film-panel" role="tabpanel" aria-labelledby="directed-tab" tabindex="0"></section>
    <section id="edited-panel" class="film-panel" role="tabpanel" aria-labelledby="edited-tab" tabindex="0" hidden></section>
    <section id="assisted-panel" class="film-panel" role="tabpanel" aria-labelledby="assisted-tab" tabindex="0" hidden></section>
  </main>
  <script>
    const filmTabs = [...document.querySelectorAll('[role="tab"]')];
    const selectFilmTab = (tab) => {
      filmTabs.forEach((item) => {
        const selected = item === tab;
        item.setAttribute('aria-selected', selected);
        item.tabIndex = selected ? 0 : -1;
        document.getElementById(item.getAttribute('aria-controls')).hidden = !selected;
      });
    };

    filmTabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectFilmTab(tab));
      tab.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
        event.preventDefault();
        const direction = event.key === 'ArrowRight' ? 1 : -1;
        const nextTab = filmTabs[(index + direction + filmTabs.length) % filmTabs.length];
        selectFilmTab(nextTab);
        nextTab.focus();
      });
    });
  </script>
</body>
</html>
