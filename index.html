<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Priya Bhatnagar's personal website">
  <title>Priya Bhatnagar</title>
  <link rel="icon" href="build/static/images/avos.png">
  <link rel="apple-touch-icon" href="build/static/images/avos.png">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-height: 100vh; background: #111; }
    main { position: relative; width: 100%; height: 100vh; height: 100svh; }
    .entry-link {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1.5rem;
      color: #fff;
      text-decoration: none;
      text-align: center;
    }
    img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
    h1, p { position: relative; margin: 0; text-shadow: 0 2px 18px rgb(0 0 0 / 55%); }
    h1 { font: 300 clamp(2rem, 7vw, 5rem)/1 sans-serif; letter-spacing: 0.04em; }
    p { font: 400 0.8rem/1.2 sans-serif; letter-spacing: 0.2em; text-transform: uppercase; }
    .entry-link:focus-visible { outline: 3px solid white; outline-offset: -8px; }
  </style>
</head>
<body>
  <main>
    <img src="build/static/images/safe_image.gif" alt="">
    <a class="entry-link" href="home.html" aria-label="Enter Priya Bhatnagar's home page">
      <h1>priya bhatnagar</h1>
      <p>click anywhere</p>
    </a>
  </main>
</body>
</html>
